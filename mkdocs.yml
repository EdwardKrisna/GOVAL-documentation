site_name: GOVAL Documentation
site_description: Geospatial Optimization & Validation Analytics Library for Indonesian Metropolitan Areas
site_author: GOVAL Team
repo_url: https://github.com/yourusername/GOVAL
repo_name: yourusername/GOVAL

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Jabodetabek Property Valuation:
    - Overview: jabodetabek/index.md
    - Workflow Guide: jabodetabek/workflow.md
    - Features & Methods: jabodetabek/features.md
    - Data Requirements: jabodetabek/data-requirements.md
    - Quick Reference: jabodetabek/quick-reference.md
  - Future Projects:
    - Bandung: coming-soon.md
    - Surabaya: coming-soon.md
  - About: about.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/GOVAL
